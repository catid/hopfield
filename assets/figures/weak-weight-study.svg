  </g>
  <g id="text_29">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #4d5967" transform="translate(59.904 412.776)">Strong weight 1; identical positive support and median-positive-coefficient/4 split. Four chains, 262,144 moves/chain.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #4d5967" transform="translate(59.904 427.776)">All three weight arms return correct answers only at the cap; none certifies. Positive reweighting preserves the zero set.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #4d5967" transform="translate(59.904 442.776)">Paired two-way bootstrap: 64 banks × 5,000 inputs, 5,000 draws. Post-hoc mechanism study; no fresh-generalization claim.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #4d5967" transform="translate(59.904 457.776)">BP AdamW and counts are separately fitted H4y controls. 128 new searches; four-worker search phase 150.039 seconds.</text>
  </g>
 </g>
