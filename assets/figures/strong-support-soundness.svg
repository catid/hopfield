  <g id="text_20">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #4d5967" transform="translate(59.904 394.92)">All 64 H4aa reduced supports retained; 59 distinct full graphs. Exact claim for every zero-energy nine-symbol coloring.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #4d5967" transform="translate(59.904 409.92)">Geometry is supplied only to the proof audit. No new fitting, puzzle inputs or GPU inference. BP AdamW is outside this fixed-model audit.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #4d5967" transform="translate(59.904 424.92)">Soundness does not guarantee a compatible answer exists, successful search, or validity of a capped nonzero-energy return.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #4d5967" transform="translate(59.904 439.92)">Original metadata failure, corrected verifier and byte-identical complete proof replay are preserved.</text>
  </g>
