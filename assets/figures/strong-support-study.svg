  <g id="text_28">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #4d5967" transform="translate(59.904 412.776)">Same 64 fits and 5,000 seen inputs; strong weights stay 1. Four chains, 262,144 moves per chain.</text>
