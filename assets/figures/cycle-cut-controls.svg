  <g id="text_20">
   <text style="font-weight: 700; font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: start" x="56.16" y="23.757187" transform="rotate(-0 56.16 23.757187)">Cycle cuts rescue 21 of 22 archived maze failures</text>
  </g>
  <g id="text_21">
   <text style="font-size: 11.4px; font-family: 'DejaVu Sans'; text-anchor: start" x="56.16" y="68.04" transform="rotate(-0 56.16 68.04)">Energy-ranked and lexicographic choices tie: no measured benefit from learned cut ordering.</text>
  </g>
  <g id="text_22">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(56.16 420.72)">Same 4,096 previously examined 120×120 loopy mazes, three fixed models; no new inputs.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(56.16 436.72)">Cycle cuts use an explicit graph prior and allow energy increases; native descent follows each cut.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(56.16 452.72)">Both cut policies solve 4,095/4,096 inputs jointly, with zero regressions versus veto. Simple paths are copied exactly.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(56.16 468.72)">Finite source-cohort result. Training differs between BP and LP; lexical costs remain computed for auditing. No fresh or optimized-runtime claim.</text>
  </g>
