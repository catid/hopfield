[project]
name = "hopfield-cram-reproduction"
version = "0.1.0"
description = "Independent CRAM reference implementation and reproducible paper experiments"
requires-python = ">=3.12"
dependencies = ["torch>=2.11", "numpy>=1.26"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
